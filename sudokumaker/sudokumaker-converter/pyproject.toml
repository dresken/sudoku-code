[project]
name = "sudokumaker-converter"
version = "1.0.0"
description = "Bidirectional converter for SudokuMaker JSON and YAML files"
requires-python = ">=3.12"
dependencies = ["ruamel.yaml>=0.18,<0.19"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
