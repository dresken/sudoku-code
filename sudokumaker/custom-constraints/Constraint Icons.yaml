formatVersion: '1'
name: Constraint Icons
backend:
  type: code
  code: |-
    function postprocessJSON(json, input) {

      // ==========================================================
      // Configuration
      // ==========================================================

      const START_X = 0.5;
      const START_Y = -0.5;
      const SPACING = 1.0;

      const VEIL = "veil";

      const VEIL_LAYER = {
        width: 1.02,
        height: 1.02,
        thickness: 1.28,
        angle: 0,
        backgroundColor: "#ffffffaa",
      };

      const DEFAULT_TEXT = {
        width: 0,
        height: 1.206,
        stroke: "#000000",
        "stroke-width": 1.28,
        "stroke-linejoin": "round",
        color: "#666666",
        angle: 0,
        rounded: true,
      };

      const ICONS = {

        "anti-knight": [
          { text: "🚫", fontSize: 42 },
          VEIL,
          { text: "♞", fontSize: 50 },
        ],

        "anti-king": [
          { text: "🚫", fontSize: 42 },
          VEIL,
          { text: "♚", fontSize: 50 },
        ],

        "anti-x": [
          { text: "🚫", fontSize: 42 },
          VEIL,
          { text: "X", fontSize: 44 },
        ],

        "anti-v": [
          { text: "🚫", fontSize: 42 },
          VEIL,
          { text: "V", fontSize: 44 },
        ],

        "nonconsecutive": [
          { text: "🚫", fontSize: 42 },
          VEIL,
          { text: "±1", fontSize: 28 },
        ],

      };

      // ==========================================================
      // Rules to display
      // ==========================================================

      const rules = input.groups[0]?.value
        ?.split(",")
        .map(s => s.trim())
        .filter(Boolean) ?? [];

      // ==========================================================
      // Generate
      // ==========================================================

      json.underlays ??= [];

      let x = START_X;

      for (const rule of rules) {

        const layers = ICONS[rule];

        if (!layers) {
          console.warn(`Unknown global rule '${rule}'`);
          x += SPACING;
          continue;
        }

        for (const layer of layers) {

          if (layer === VEIL) {
            json.underlays.push({
              center: [x, START_Y],
              ...VEIL_LAYER,
            });
            continue;
          }

          json.underlays.push({
            center: [
              x + (layer.dx ?? 0),
              START_Y + (layer.dy ?? 0),
            ],
            ...DEFAULT_TEXT,
            ...layer,
          });

        }

        x += SPACING;
      }

    }
input:
- id: groups
  label: Groups
  params:
    type: raw
