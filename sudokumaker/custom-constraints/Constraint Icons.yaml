formatVersion: '1'
name: Constraint Icons
backend:
  type: code
  code: |-
    function postprocessJSON(json, input, helpers, puzzle) {
      // Input: comma-separated icon keys.
      // Blank or "auto" = automatic detection.
      // "auto,icon" = automatic + manual.
      // "icon1,icon2" = manual only.
      //
      // To add a new icon:
      // 1. Add it to ICONS.
      // 2. (Optional) Add an AUTO_RULES detector.
      
      // ==========================================================
      // Configuration
      // ==========================================================

      const START_X = -0.5;
      const START_Y = 0.5;
      const SPACING = 1.0;
      const AUTO_RULES = [
        {
          icon: "anti-king",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.Antiking,
        },
      
        {
          icon: "anti-knight",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.Antiknight,
        },
      
        {
          icon: "disjoint-groups",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.DisjointGroups,
        },
      
        {
          icon: "nonconsecutive",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.Nonconsecutive,
        },
      
        {
          icon: "global-2x2",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.GlobalEntropy,
        },
      
        {
          icon: "anti-doubles",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.Ratio &&
            c.config.negative?.length > 0,
        },
      
        {
          icon: "nonconsecutive",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.Difference &&
            c.config.negative?.length > 0,
        },
      
        {
          icon: "anti-x",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.XV &&
            c.config.negative?.includes(10),
        },
      
        {
          icon: "anti-v",
          matches: c =>
            c.enabled &&
            c.config.type == Api.PuzzleElementType.XV &&
            c.config.negative?.includes(5),
        },
      
      ];
      const DEFAULT_TEXT = {
        width: 0,
        height: 1.206,
        stroke: "#ffffff",
        "stroke-width": 0.5,
        "stroke-linejoin": "round",
        color: "#666666",
        angle: 0,
        rounded: true,
      };

      const DEFAULT_PATH = {
        stroke: "#666666",
        fill: "none",
        "stroke-width": 1.28,
        "stroke-linejoin": "round",
        "stroke-linecap": "round",
      };

      function rect(x, y, width, height = width) {
        const x1 = x - width / 2;
        const y1 = y - height / 2;
        const x2 = x + width / 2;
        const y2 = y + height / 2;
      
        return `M${x1} ${y1}H${x2}V${y2}H${x1}Z`;
      }
      
      function circle(x, y, r) {
        return `M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0-${2*r} 0`;
      }
      // Icon definitions. Layers are top to bottom. 
      // Layers may contain { text, fontSize } or { path }.
      const ICONS = {

        "anti-knight": [
          { text: "♞", fontSize: 52 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "anti-king": [
          { text: "♚", fontSize: 52 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "anti-x": [
          { text: "X", fontSize: 38 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "anti-v": [
          { text: "V", fontSize: 38 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "nonconsecutive": [
          { text: "±", fontSize: 24, dy:-0.11, dx:-0.05 },
          { text: "1", fontSize: 24, dy:0.11, dx:-0.05 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "anti-doubles": [
          { text: "×", fontSize: 24, dy:-0.11, dx:-0.05 },
          { text: "2", fontSize: 24, dy:0.11, dx:-0.05 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],

        "anti-doubles": [
          { text: "×", fontSize: 24, dy:-0.11, dx:-0.05 },
          { text: "2", fontSize: 24, dy:0.11, dx:-0.05 },
          { text: "🚫", fontSize: 42, opacity: 0.4 },
        ],
        
        "disjoint-groups": [
          {
            path: 
              "M6.4 6.4V-6.4H19.2V6.4 " +
              "M6.4 19.2H-6.4V-6.4H6.4V-19.2H19.2V-6.4 " +
              "M-6.4 6.4H-19.2V19.2H-6.4 " +
              "M6.4-19.2H-6.4V-6.4H-19.2V6.4 " +
              "M-6.4-19.2H-19.2V-6.4 " +
              "M-6.4 6.4H19.2V19.2H6.4V6.4"
          },
          {
            path: [
              circle(-12.8, -12.8, 2.5),
              circle(0,     -12.8, 2.5),
              circle(12.8,  -12.8, 2.5),
              
              circle(-12.8, 0,      2.5),
              circle(0,      0,      2.5),
              circle(12.8,   0,      2.5),
              
              circle(-12.8, 12.8,   2.5),
              circle(0,      12.8,   2.5),
              circle(12.8,   12.8,   2.5),
            ].join(" "),
            fill: "#666666",
            stroke: "none",
          },
        ],
        
        "global-2x2": [
          {
            path: rect(-9.6, -9.6, 19.2),
            fill: "#0044C455",
          },
          {
            path: rect(9.6, -9.6, 19.2),
            fill: "#CC331155",
          },
          {
            path: rect(-9.6, 9.6, 19.2),
            fill: "#eeeeee55",
          },
          {
            path: rect(9.6, 9.6, 19.2),
            fill: "#11773355",
          },
          { text: "?", fontSize: 10, dx:0.1, dy:-0.15 },
        ],

        "rotational": [
          { text: "↻", fontSize: 38 },
        ],
        
      };

      // ==========================================================
      // Rules to display
      // ==========================================================

      const rules = new Set(
        input.groups[0]?.value
          ?.split(",")
          ?.map(s => s.trim())
          ?.filter(Boolean) ?? []
      );

      if (rules.has("auto") || rules.size == 0) {
      
          for (const detector of AUTO_RULES) {
      
              if (puzzle.allConstraints.some(detector.matches)) {
                  rules.add(detector.icon);
              }
      
          }
      
          rules.delete("auto");
      }
      // ==========================================================
      // Generate
      // ==========================================================

      json.underlays ??= [];

      let y = START_Y;

      for (const rule of rules) {

        const layers = ICONS[rule];

        if (!layers) {
          console.warn(`Unknown global rule '${rule}'`);
          y += SPACING;
          continue;
        }

        for (const layer of layers) {

          if (layer.path) {
        
            json.lines ??= [];
        
            json.lines.push({
              target: "underlay",
              d: layer.path,
              transform: `translate(${y * 64} ${START_X * 64})`,
              ...DEFAULT_PATH,
              ...layer,
            });
          } else {
            json.underlays.push({
              center: [
                START_X + (layer.dx ?? 0),
                y + (layer.dy ?? 0),
              ],
              ...DEFAULT_TEXT,
              ...layer,
            });
          }

        }

        y += SPACING;
      }

    }
      //console.table(Api.PuzzleElementType);
      //for (const c of puzzle.allConstraints) {
      //  console.log(JSON.stringify(c, null, 2));
      //}
      //for (const c of puzzle.allConstraints) {
      //    console.log(
      //        c.name,
      //        c.config.type,
      //        Object.entries(Api.PuzzleElementType)
      //           .find(([, v]) => v === c.config.type)
      //    );
      //}
      //console.table(Api.PuzzleElementType);

      //return;
input:
- id: groups
  label: Groups
  params:
    type: raw
